[package]
name = "mfs-stitcher"
version = "0.1.0"
edition = "2021"
authors = ["MfsFlow Authors"]
description = "High-performance Smart-seq3 molecule stitching and isoform compatibility caller in Rust"

[dependencies]
rust-htslib = "0.50"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
