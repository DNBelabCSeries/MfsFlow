name: MfsFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q mfsflow tests

      - name: Install native runtime for bundled tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Check patch formatting
        run: git diff --check

      - name: Check CLI and bundled tools
        run: |
          python -m mfsflow.cli --version
          python -m mfsflow.cli --help >/dev/null
          test -x mfsflow/software/STAR
          test -x mfsflow/software/featureCounts
          test -x mfsflow/software/pigz
          test -x mfsflow/software/samtools
          test -x mfsflow/software/seqkit
          mfsflow/software/STAR --version
          mfsflow/software/featureCounts -v
          pigz_ok=true
          if ! mfsflow/software/pigz --version; then
            pigz_ok=false
          elif ! printf 'MfsFlow pigz runtime smoke test\n' | mfsflow/software/pigz -c >/dev/null; then
            pigz_ok=false
          fi
          if [ "$pigz_ok" = false ]; then
            echo "Bundled pigz is incompatible with this runner; testing the supported fallback."
            python mfsflow/scripts/pigz_compat.py --version
            printf 'MfsFlow pigz fallback smoke test\n' | python mfsflow/scripts/pigz_compat.py -c >/dev/null
          fi
          mfsflow/software/samtools --version
          mfsflow/software/seqkit version

  package:
    name: Build and inspect wheel
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel without dependencies
        run: python -m pip install --no-deps --target wheel_check dist/*.whl

      - name: Verify packaged resources
        run: |
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE/wheel_check:$GITHUB_WORKSPACE" \
            python -m unittest tests.test_package_data -v

  rust:
    name: Rust stitcher checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path crates/mfs-stitcher/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path crates/mfs-stitcher/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path crates/mfs-stitcher/Cargo.toml
